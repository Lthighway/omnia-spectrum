name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk omnia-spectrum-v0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: omnia-spectrum-debug-apk
          path: omnia-spectrum-v0.1.0-debug.apk
      - name: Publish initial APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 omnia-spectrum-v0.1.0-debug.apk --title "OMNIA Spectrum v0.1.0 (experimental)" --notes "APK de teste, assinado com chave de debug. Captura óptica experimental offline; não mede radiação térmica ou espectro calibrado." --latest
          else
            gh release upload v0.1.0 omnia-spectrum-v0.1.0-debug.apk --clobber
          fi
